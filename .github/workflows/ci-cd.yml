name: Django CI/CD Pipeline

on: [push, pull_request]

jobs:
  tests:
    name: Run Django Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create .env for CI
        run: |
            cat > .env <<EOF
            # Django
            SECRET_KEY=django-insecure-"sk_test_BQokikJOvBiI2HlWgH4olfQ2"
            DEBUG=True
            DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
            
            # PostgreSQL
            POSTGRES_DB=mydb
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=4815
            POSTGRES_HOST=db
            POSTGRES_PORT=5432
            
            # Redis
            REDIS_HOST=redis
            REDIS_PORT=6379
            
            CELERY_BROKER_URL=redis://redis:6379/0
            CELERY_RESULT_BACKEND=redis://redis:6379/0
            CELERY_TIME_ZONE=Europe/Moscow
            CELERY_ENABLE_UTC=False
            
            # Email
            EMAIL_HOST=smtp.yourhost.com
            EMAIL_PORT=587
            EMAIL_HOST_USER=you@domain.com
            EMAIL_HOST_PASSWORD=secret
            EMAIL_USE_TLS=True
            DEFAULT_FROM_EMAIL=you@domain.com
            
            # JWT
            JWT_LIFETIME_MINUTES=60
            

        timeout-minutes:
        continue-on-error: false
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings -q

  deploy:
    name: Deploy to Remote Server
    needs: tests
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} -p ${{ secrets.SERVER_SSH_PORT }} << 'EOF'
            set -e
            cd ${{ secrets.PROJECT_DIR }}
            git fetch --all
            git reset --hard origin/develop
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo systemctl restart gunicorn
          EOF